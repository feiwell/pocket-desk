          font-size="16" letter-spacing="3" fill="#8A93A0">iOS · COREDEVICE RSD · 单机</text>

    <text x="54" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
